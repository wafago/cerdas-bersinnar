name: Deploy to Hostinger

on:
  push:
    branches:
      - main   # otomatis jalan kalau push ke branch "main"

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Ambil kode dari repo
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Install Node.js (versi 18 cocok untuk Vite)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Build project
      - name: Build project
        run: npm run build

      # Step 5: Upload hasil dist/ ke Hostinger via FTP
      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/ # sesuaikan dengan folder hosting kamu
          local-dir: dist/
